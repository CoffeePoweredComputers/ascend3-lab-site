  <style>
    /* Slide-local choreography for the name-breaking walkthrough. Built on the
       .frag step states; used by this slide only, all values from tokens. */

    /* No header: the composition owns the canvas, centred vertically.
       --name-size is the biggest the one-line name fits at (t-h1 overflows). */
    #slide-04 {
      justify-content: center;
      --name-size: calc(var(--t-h2) * 1.2);
    }

    /* ---- the course name, one line, both halves on a shared baseline ---- */
    #slide-04 .namebreak {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: var(--s-3);
      margin: 0 0 var(--s-7);
      font-family: var(--font-display);
      font-size: var(--name-size);
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--accent-1);
    }
    #slide-04 .namebreak__design {
      font-size: calc(var(--name-size) * var(--shrink, 1));
      transition: font-size .5s ease, color .5s ease;
    }
    /* One notch smaller per skill included (rules tie on specificity, so
       source order decides; the step-8 restore below sits last and wins). */
    #slide-04:has(li[data-step="1"]:not(.is-pending)) { --shrink: .9; }
    #slide-04:has(li[data-step="2"]:not(.is-pending)) { --shrink: .8; }
    #slide-04:has(li[data-step="3"]:not(.is-pending)) { --shrink: .7; }
    #slide-04:has(li[data-step="4"]:not(.is-pending)) { --shrink: .58; }
    #slide-04:has(li[data-step="5"]:not(.is-pending)) { --shrink: .45; }
    #slide-04:has(li[data-step="1"]:not(.is-pending)) .namebreak__design { color: var(--fg-1); }
    /* step 8: balance restored */
    #slide-04:has(li.skill--new:not(.is-pending)) { --shrink: 1; }
    #slide-04:has(li.skill--new:not(.is-pending)) .namebreak__design { color: var(--accent-1); }

    /* ---- skills lineup: little boxes, icon above, label under ---- */
    #slide-04 .skills {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: var(--s-3);
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: var(--t-small);
    }
    #slide-04 .skills li {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: var(--s-2);
      margin: 0;
      padding: var(--s-3) var(--s-1);
      border: 3px solid var(--accent-2);
      border-radius: var(--r-2);
      background: var(--bg-1);
      white-space: nowrap;
    }
    #slide-04 .skills li.is-pending { transform: translateY(var(--s-2)); }
    #slide-04 .skills svg {
      width: var(--s-7);
      height: var(--s-7);
      fill: none;
      stroke: currentColor;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: var(--accent-2);
    }
    /* New skills: orange, collapsed until step 8, bump in from the right.
       The flex gap sits outside the box, so a pending chip also cancels it
       with a negative margin. */
    #slide-04 .skills li.skill--new {
      border-color: var(--accent-3);
      color: var(--accent-3);
      overflow: hidden;
      max-width: 360px;
      transition:
        opacity .4s ease,
        transform .5s cubic-bezier(.2, 1.5, .4, 1),
        max-width .5s cubic-bezier(.2, 1.5, .4, 1),
        margin .5s ease, padding .5s ease, border-width .5s ease;
    }
    #slide-04 .skills li.skill--new svg { color: var(--accent-3); }
    #slide-04 .skills li.skill--new + li.skill--new { transition-delay: .12s; }
    #slide-04 .skills li.skill--new.is-pending {
      max-width: 0;
      padding-left: 0;
      padding-right: 0;
      border-left-width: 0;
      border-right-width: 0;
      margin-left: calc(-1 * var(--s-3));
      transform: translateX(var(--s-7));
    }

    /* ---- step 6: the shatter; step 7: it heals (is-past fades it out) ---- */
    #slide-04 .smash {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--bg-1) 45%, transparent);
      transition: opacity .8s ease;          /* exit pace: the slow repair */
    }
    #slide-04 .smash.is-current { transition-duration: .12s; }   /* entry: abrupt */
    #slide-04 .smash.is-past { opacity: 0; }
    #slide-04 .smash__cracks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--fg-0);
      transform-origin: 50% 50%;
      transition: transform .3s cubic-bezier(.2, 1.4, .4, 1);
    }
    #slide-04 .smash__brand {
      position: relative;
      padding: var(--s-4) var(--s-6);
      border-radius: var(--r-3);
      background: var(--fg-0);
      color: var(--bg-0);
      font-weight: 700;
      font-size: var(--t-h1);
      transform: rotate(-4deg);
      box-shadow: 0 var(--s-2) var(--s-6) color-mix(in srgb, var(--fg-0) 45%, transparent);
      transition: transform .45s cubic-bezier(.2, 1.6, .4, 1);
    }
    #slide-04 .smash.is-pending .smash__brand { transform: rotate(-14deg) scale(.3); }
    #slide-04 .smash.is-pending .smash__cracks { transform: scale(.85); }
  </style>
