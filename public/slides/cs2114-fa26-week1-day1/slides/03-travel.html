    #slide-03.is-active .tr-pin circle {
      animation: tr-pop 420ms ease-out forwards;
      animation-delay: calc(var(--i) * 80ms + 150ms);
    }
    @keyframes tr-pop {
      0%   { opacity: 0; transform: scale(0.2); }
      70%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ---------- labels ---------- */
    #slide-03 .tr-lab { opacity: 0; }
    #slide-03.is-active .tr-lab {
      animation: tr-fade 380ms ease-out forwards;
      animation-delay: calc(var(--i) * 80ms + 330ms);
    }
    @keyframes tr-fade { to { opacity: 1; } }
    #slide-03 .tr-lab line {
      stroke: color-mix(in srgb, var(--fg-1) 60%, transparent);
      stroke-width: 1.8;
    }
    /* Halo the labels so leader lines, route dots and land can't cut through
       the glyphs — standard cartographic knockout. */
    #slide-03 .tr-lab text {
      font-family: var(--font-body);
      font-size: var(--t-micro);
      font-weight: 700;
      fill: var(--fg-0);
      paint-order: stroke fill;
      stroke: var(--bg-0);
      stroke-width: 6px;
      stroke-linejoin: round;
    }
    /* Gradient stops take tokens via CSS — var() inside a stop-color
       presentation attribute is not reliably parsed. */
    #slide-03 .tr-grad-a { stop-color: var(--accent-1); }
    #slide-03 .tr-grad-b { stop-color: var(--accent-3); }

    /* ---------- route + plane (step 1) ---------- */
    #slide-03 .tr-leg {
      fill: none;
      stroke: url(#tr-routegrad);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 1 14;
    }
    /* Each mask stroke's dashoffset is set to its true length by JS, then
       driven to 0 over its own flight window. Timing is linear end to end —
       reveal windows and photo arrivals are plain distance fractions. */
    #slide-03 #tr-plane { opacity: 0; }
    #slide-03 #tr-plane path { fill: var(--accent-1); stroke: var(--bg-0); stroke-width: 1.5; }

    #slide-03.tr-flying .tr-rl {
      animation: tr-draw var(--t) linear var(--d) forwards;
    }
    @keyframes tr-draw { to { stroke-dashoffset: 0; } }

    #slide-03.tr-flying #tr-plane {
      offset-path: path("M288.3,163.3 Q709.5,99.8 1098.1,274.0 Q698.9,14.0 236.7,154.8 Q259.9,174.8 288.3,163.3 Q196.6,214.7 94.2,190.8 Q196.6,214.7 288.3,163.3 Q881.3,631.0 1636.4,615.2 Q881.3,631.0 288.3,163.3 Q489.0,113.6 693.6,143.8 Q670.2,97.4 690.7,49.7 Q693.5,49.4 696.3,49.1 Q465.4,14.0 288.3,163.3 Q282.5,152.7 290.6,143.7 Q282.5,152.7 288.3,163.3 Q520.5,48.5 779.5,50.7 Q520.5,48.5 288.3,163.3");
      offset-rotate: auto;
      animation: tr-fly 9500ms linear forwards;
    }
    /* The plane parks back home in Blacksburg rather than vanishing — that is
       the slide's whole joke, so at rest it must still be on screen. */
    @keyframes tr-fly {
      0%   { offset-distance: 0%;   opacity: 0; }
      3%   { opacity: 1; }
      100% { offset-distance: 100%; opacity: 1; }
    }

    /* ---------- polaroids ---------- */
    #slide-03 .polaroid {
      position: absolute;
      box-sizing: border-box;
      width: 300px;
      padding: 14px 14px 0;
      background: var(--paper);
      border-radius: var(--r-1);
      box-shadow: 0 12px 28px color-mix(in srgb, var(--fg-0) 24%, transparent);
      transform: rotate(var(--rot));
      opacity: 0;
    }
    #slide-03 .polaroid::before {          /* tape strip over the top edge */
      content: "";
      position: absolute;
      left: 50%;
      top: -14px;
      width: 110px;
      height: 30px;
      margin-left: -55px;
      transform: rotate(-3deg);
      background: color-mix(in srgb, var(--stone) 30%, transparent);
    }
    /* Photos land with the plane: the drop fires on the flight (step 1), each
       delayed to its stop's arrival time, and re-arms if you step back. */
    #slide-03.tr-flying .polaroid {
      animation: tr-drop 480ms ease-out forwards;
      animation-delay: var(--pd);
    }
    @keyframes tr-drop {
      from { opacity: 0; transform: translateY(-20px) rotate(0deg) scale(1.05); }
      to   { opacity: 1; transform: translateY(0) rotate(var(--rot)) scale(1); }
    }
    #slide-03 .polaroid img {
      width: 100%;
      height: 126px;              /* 272px wide inside the frame ≈ the shots' 2.2:1 */
      object-fit: cover;
      display: block;
    }
    #slide-03 .polaroid__cap {
      margin: 0;
      padding: var(--s-1) 0 var(--s-2);
      font-family: var(--font-display);
      font-style: italic;
      font-size: var(--t-tag);
      line-height: 1.2;
      color: var(--fg-1);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      #slide-03 .tr-pin circle,
      #slide-03 .tr-lab,
      #slide-03 .polaroid { animation: none !important; opacity: 1; }
      #slide-03 .tr-pin circle { transform: none; }
      #slide-03.tr-flying .tr-rl,
      #slide-03.tr-flying #tr-plane { animation-duration: 1ms !important; animation-delay: 0ms !important; }
    }
  </style>

  <script>
  (function () {
    // Route reveal is length-driven: measure the real path rather than guessing
    // a dasharray. Re-armed on every entry so the flight replays on step-back.
    const SID = 'slide-03';
    const FLY = 'tr-flying';

    function scope() { return document.getElementById(SID); }

    function arm(s) {
      s.querySelectorAll('.tr-rl').forEach((stroke) => {
        const len = stroke.getTotalLength();
        stroke.style.strokeDasharray = len;
        stroke.style.strokeDashoffset = len;
      });
    }

    function sync() {
      const s = scope(); if (!s) return;
      if (!s.classList.contains('is-active')) { s.classList.remove(FLY); arm(s); return; }
      const step = (window.deck && window.deck.state) ? window.deck.state.step : 0;
      if (step >= 1) {
        if (!s.classList.contains(FLY)) { arm(s); void s.offsetWidth; s.classList.add(FLY); }
      } else {
        s.classList.remove(FLY);
        arm(s);
      }
    }

    window.addEventListener('slides:loaded', () => { const s = scope(); if (s) arm(s); sync(); });
    window.addEventListener('deck:stepchange', sync);
  })();
  </script>

  <div data-sid="03-travel:24" class="slide__number"></div>
</section>
