# ascend3.cs.vt.edu - ASCEND Lab static site

# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name ascend3.cs.vt.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - serve static site
server {
    listen 443 ssl http2;
    server_name ascend3.cs.vt.edu;

    ssl_certificate /etc/letsencrypt/live/ascend3.cs.vt.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascend3.cs.vt.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/ascend3;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
