# ascend3.cs.vt.edu - ASCEND Lab static site

# WebSocket upgrades for the lab tools block below (Streamlit, Shiny, Gradio).
# `map` must sit in the http context; sites-enabled files are included there.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name ascend3.cs.vt.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - serve static site
server {
    listen 443 ssl http2;
    server_name ascend3.cs.vt.edu;

    ssl_certificate /etc/letsencrypt/live/ascend3.cs.vt.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ascend3.cs.vt.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/ascend3;
    index index.html;

    # Adaptive survey service (survey/): a Node process on loopback. `^~` stops the
    # regex asset location below from capturing /survey/app.js etc.; no URI on
    # proxy_pass keeps the /survey/ prefix, which the app owns.
    location = /survey { return 301 /survey/; }
    location ^~ /survey/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # one model call can take tens of seconds
        client_max_body_size 64k;
    }

    # GenAI transcript submission (transcript-drop/): a Python process on loopback.
    # `^~` stops the regex asset location below from capturing /transcript-drop/static/*.
    # Unlike /survey/ the trailing slash on proxy_pass STRIPS the prefix, so the
    # app goes on serving at its own root; the page's URLs are all relative, which
    # puts the prefix back on the browser's side. The `= /transcript-drop`
    # redirect is what guarantees the trailing slash those relative URLs need.
    location = /transcript-drop { return 301 /transcript-drop/; }
    location ^~ /transcript-drop/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API refuses bodies over 40 MB itself, but only after reading a
        # Content-Length a client is free to lie about. Stopping an oversized
        # body here means it never reaches Python, which is where the memory
        # would go. The margin covers JSON overhead on a legitimate 40 MB file.
        client_max_body_size 48M;

        # Submissions serialise behind a single SQLite writer. A whole class
        # submitting at once was measured at about 3 seconds each, and the
        # largest bodies at around 45 under a full queue. A timeout shorter than
        # that turns a slow submission into a lost one, at the moment it is most
        # expensive.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Lab tools (tools/): member-only Docker containers on loopback, one per
    # tools/<name>/ directory in the repo. NOTHING in this block changes when a
    # tool is added or removed. The gate on 8790 checks the member cookie AND
    # answers which port the named tool is on (X-Tool-Port), so there is no
    # per-tool location, no nginx edit and no reload. The outer `^~` means the
    # asset regex further down can never capture /tools/<name>/app.js.
    location ^~ /tools/ {
        location = /tools/ { return 301 /wiki/lab-tools; }

        # Gate endpoints: session (mint the cookie), status, healthz. Not gated.
        location ^~ /tools/_/ {
            proxy_pass http://127.0.0.1:8790/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 16k;
        }

        # auth_request target; `internal` keeps it off the network.
        location = /tools/_/check {
            internal;
            proxy_pass http://127.0.0.1:8790/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Tool $tool;         # subrequests share the parent's variables
        }

        # /tools/<name> -> /tools/<name>/ so the tool's relative URLs resolve.
        location ~ ^/tools/[a-z0-9][a-z0-9-]*$ { return 301 $uri/$is_args$args; }

        location ~ ^/tools/(?<tool>[a-z0-9][a-z0-9-]*)/ {
            auth_request /tools/_/check;
            auth_request_set $tool_port $upstream_http_x_tool_port;
            auth_request_set $tool_user $upstream_http_x_tool_user;   # who is asking, from the cookie
            auth_request_set $tool_uid  $upstream_http_x_tool_uid;
            auth_request_set $tool_role $upstream_http_x_tool_role;   # member | participant
            error_page 401 = @tools_signin;        # no cookie: go sign in on the wiki

            # Strip the prefix (as /transcript-drop/ does) and tell the app
            # what it was, for frameworks that build absolute URLs.
            rewrite ^/tools/[a-z0-9-]+(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:$tool_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tools/$tool;
            proxy_set_header X-Tool-User $tool_user;      # set here, so a client cannot spoof them
            proxy_set_header X-Tool-Uid  $tool_uid;
            proxy_set_header X-Tool-Role $tool_role;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;                   # SSE / streaming tools
            client_max_body_size 32M;
            proxy_read_timeout 300s;
        }
    }
    location = /tools { return 301 /wiki/lab-tools; }
    location @tools_signin { return 302 /wiki/lab-tools?next=$request_uri; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
